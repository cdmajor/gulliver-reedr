<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reedr</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 300px;
      background: #0d0d22;
      color: #f0f0f8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 16px;
    }
    .logo { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .mark {
      width: 32px; height: 32px; border-radius: 9px;
      background: linear-gradient(135deg, #6d5ffa, #a78bfa);
      display: grid; place-items: center; font-weight: 800; color: #fff;
    }
    h1 { font-size: 15px; font-weight: 700; }
    p { font-size: 12.5px; color: #9090b8; line-height: 1.5; margin-bottom: 10px; }
    .ok { color: #34d399; font-size: 12px; margin-bottom: 12px; }
    .err { color: #f87171; font-size: 12px; margin-bottom: 12px; }
    button {
      width: 100%; border: none; border-radius: 10px; padding: 10px 12px;
      font-weight: 600; cursor: pointer; font-size: 13px; margin-top: 6px;
    }
    .primary { background: linear-gradient(135deg, #6d5ffa, #8b7cf8); color: #fff; }
    .ghost { background: #1e1e40; color: #c0c0e8; }
    code { font-family: ui-monospace, monospace; font-size: 11px; color: #a78bfa; }
  </style>
</head>
<body>
  <div class="logo">
    <div class="mark">R</div>
    <h1>Reedr</h1>
  </div>
  <p id="status">Checking…</p>
  <p>
    Open any <strong style="color:#e0e0f8">http(s) article</strong> (news, docs, blog),
    then click the purple <strong style="color:#e0e0f8">R</strong> bottom-right.
  </p>
  <p>
    Won’t appear on Chrome settings, the new-tab page, or the Chrome Web Store.
    After installing, <strong style="color:#e0e0f8">refresh the page</strong>.
  </p>
  <button class="primary" id="openPage">Open example.com to try</button>
  <button class="ghost" id="openSettings">Open Settings</button>
  <script src="popup.js"></script>
</body>
</html>
