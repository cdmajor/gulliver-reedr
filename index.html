<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />

    <!-- Primary -->
    <title>Reedr — Your browser, but it thinks.</title>
    <meta name="description" content="Reedr is a browser extension that reads every page you visit — articles, docs, threads, product pages — and is always ready to discuss, explain, or dig into it with you. Works on Chrome, Edge, Firefox, Brave, Opera, and Safari." />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0d0d22" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://victor.ai.life/" />
    <meta property="og:title" content="Reedr — He's read it already." />
    <meta property="og:description" content="A browser extension that reads every page you visit and is always ready to discuss it. No copy-pasting. No explaining the context. Just ask." />
    <meta property="og:image" content="https://victor.ai.life/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="Reedr" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@reedrextension" />
    <meta name="twitter:title" content="Reedr — He's read it already." />
    <meta name="twitter:description" content="A browser extension that reads every page you visit and is always ready to discuss it. Works on Chrome, Edge, Firefox, Brave, Opera, and Safari." />
    <meta name="twitter:image" content="https://victor.ai.life/og-image.jpg" />

    <!-- Canonical -->
    <link rel="canonical" href="https://victor.ai.life/" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
